<body style="margin:0; padding:0;">
<div id="root">
<style>
  html, body { margin:0; padding:0; background:#1c1430; }
  #root {
    font-family: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
    color: #efe6ff;
    min-height: 100dvh;
    background: radial-gradient(ellipse at top, #2b2140 0%, #140f22 75%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 20px 30px;
    box-sizing: border-box;
    position: relative;
    overflow-x: hidden;
  }
  #root * { box-sizing: border-box; }

  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; text-align: center; padding: 0 20px; }
  .sub { font-size: 13px; color: #b9a8e0; margin-bottom: 22px; text-align: center; padding: 0 30px; }
  .progress { font-size: 13px; color: #d8c8ff; margin-bottom: 14px; }

  #wrapper {
    position: relative;
    width: 100%;
    max-width: 900px;
  }

  .board {
    position: absolute;
    border-radius: 6px;
    border: 2px dashed rgba(255,255,255,0.3);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    transition: opacity 0.35s ease;
  }
  .board.fadeout { opacity: 0; }

  .piece {
    position: absolute;
    touch-action: none;
    cursor: grab;
    background-repeat: no-repeat;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }
  .piece.dragging { cursor: grabbing; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.65)); }
  .piece.placed { cursor: default; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }

  .flipOuter { position: absolute; perspective: 1400px; }
  .flipInner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }
  .flipInner.flip {
    animation: flipReveal 1.05s cubic-bezier(.4,.2,.2,1) forwards;
  }
  @keyframes flipReveal {
    0%   { transform: rotateY(0deg) scale(1); }
    50%  { transform: rotateY(90deg) scale(1.06); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 10px; overflow: hidden; }
  .faceFront { transform: rotateY(0deg); }
  .faceBack {
    transform: rotateY(180deg);
    background-size: cover;
    background-position: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .caption {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 22px 20px 30px; text-align: center;
    background: linear-gradient(transparent, rgba(0,0,0,0.75) 40%);
    opacity: 0; transform: translateY(12px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    pointer-events: none; z-index: 50;
  }
  .caption.show { opacity: 1; transform: translateY(0); }
  .caption .big { font-size: 26px; font-weight: 800; color: #ffdd66; }
  .caption .small { font-size: 15px; color: #f0e8ff; margin-top: 4px; }

  .confetti {
    position: fixed; top: -12px; width: 8px; height: 14px; opacity: 0.95;
    z-index: 60; animation: fall linear forwards; pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(400deg); opacity: 0.3; } }
</style>

  const COLS = 3, ROWS = 4;

  const wrapper = document.getElementById('wrapper');
  const progressEl = document.getElementById('progress');
  const captionEl = document.getElementById('caption');

  const HEADER_RESERVE = 130; // title + sub + progress + outer padding
  const availH = window.innerHeight - HEADER_RESERVE;
  const availW = window.innerWidth - 40;

  let isWide = window.innerWidth >= 760;

  let BOARD_W, BOARD_H, boardLeft, boardTop, trayLeft, trayTop, trayCols, trayCellW, trayCellH;

  if (isWide) {
    BOARD_H = Math.min(560, Math.max(320, availH));
    BOARD_W = BOARD_H * (675 / 1200);
    trayCols = 4;
    // rough cell/box estimate to size tray before final CELL calc (same formulas as below)
    const estCellW = BOARD_W / COLS, estCellH = BOARD_H / ROWS;
    const estTab = 0.30 * Math.min(estCellW, estCellH);
    const estOM = estTab * 0.68;
    const estBoxW = estCellW + 2 * estOM;
    trayCellW = estBoxW + 22;
    const neededWidth = BOARD_W + 40 + trayCols * trayCellW + 20;
    if (neededWidth > availW) isWide = false; // fallback if window too narrow after all
  }

  if (isWide) {
    boardLeft = 4;
    boardTop = 0;
    trayLeft = boardLeft + BOARD_W + 40;
    trayTop = 0;
  } else {
    BOARD_W = Math.min(300, window.innerWidth - 40);
    BOARD_H = BOARD_W * (1200 / 675);
    boardLeft = (Math.min(420, window.innerWidth) - BOARD_W) / 2;
    boardTop = 0;
    trayCols = 2;
    trayLeft = 0;
    trayTop = boardTop + BOARD_H + 46;
  }

  const CELL_W = BOARD_W / COLS;
  const CELL_H = BOARD_H / ROWS;
  const TAB = 0.30 * Math.min(CELL_W, CELL_H);
  const OM = TAB * 0.68;
  const BOX_W = CELL_W + 2 * OM;
  const BOX_H = CELL_H + 2 * OM;

  const board = document.createElement('div');
  board.className = 'board';
  board.style.left = boardLeft + 'px';
  board.style.top = boardTop + 'px';
  board.style.width = BOARD_W + 'px';
  board.style.height = BOARD_H + 'px';
  wrapper.appendChild(board);

  // ---- jigsaw edge signs ----
  const vSign = []; // seam between col c,c+1 at row r
  for (let r = 0; r < ROWS; r++) {
    vSign.push([]);
    for (let c = 0; c < COLS - 1; c++) vSign[r].push(Math.random() < 0.5 ? 1 : -1);
  }
  const hSign = []; // seam between row r,r+1 at col c
  for (let r = 0; r < ROWS - 1; r++) {
    hSign.push([]);
    for (let c = 0; c < COLS; c++) hSign[r].push(Math.random() < 0.5 ? 1 : -1);
  }

  const KNOB = [
    [0.00, 0], [0.34, 0], [0.34, 0.30], [0.24, 0.42],
    [0.50, 0.55], [0.76, 0.42], [0.66, 0.30], [0.66, 0], [1.00, 0]
  ];

  function edgePoints(edge, sign) {
    const src = sign === 0 ? [[0, 0], [1, 0]] : KNOB;
    return src.map(([t, off]) => {
      const o = sign * off * TAB;
      let x, y;
      if (edge === 'top') { x = OM + t * CELL_W; y = OM - o; }
      else if (edge === 'right') { x = OM + CELL_W + o; y = OM + t * CELL_H; }
      else if (edge === 'bottom') { x = OM + CELL_W - t * CELL_W; y = OM + CELL_H + o; }
      else { x = OM - o; y = OM + CELL_H - t * CELL_H; }
      return { x, y };
    });
  }

  function buildClipPath(r, c) {
    const topSign = r === 0 ? 0 : -hSign[r - 1][c];
    const rightSign = c === COLS - 1 ? 0 : vSign[r][c];
    const bottomSign = r === ROWS - 1 ? 0 : hSign[r][c];
    const leftSign = c === 0 ? 0 : -vSign[r][c - 1];

    const pts = [
      ...edgePoints('top', topSign),
      ...edgePoints('right', rightSign),
      ...edgePoints('bottom', bottomSign),
      ...edgePoints('left', leftSign)
    ];
    return 'polygon(' + pts.map(p => p.x.toFixed(1) + 'px ' + p.y.toFixed(1) + 'px').join(',') + ')';
  }

  // tray area (beside board on wide screens, below board on narrow screens)
  const trayWidth = isWide ? trayCols * trayCellW : Math.min(420, window.innerWidth);
  if (!isWide) trayCellW = trayWidth / trayCols;
  trayCellH = BOX_H + (isWide ? 12 : 24);

  let pieceData = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) pieceData.push({ r, c });
  for (let i = pieceData.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pieceData[i], pieceData[j]] = [pieceData[j], pieceData[i]];
  }


  const total = pieceData.length;
  let placedCount = 0;
  progressEl.textContent = '0 / ' + total + ' platziert';

  let trayRow = 0, trayCol = 0;

  pieceData.forEach((pd, idx) => {
    const piece = document.createElement('div');
    piece.className = 'piece';
    piece.style.width = BOX_W + 'px';
    piece.style.height = BOX_H + 'px';
    piece.style.clipPath = buildClipPath(pd.r, pd.c);
    piece.style.backgroundImage = 'url(' + PATTERN_SRC + ')';
    piece.style.backgroundSize = BOARD_W + 'px ' + BOARD_H + 'px';
    piece.style.backgroundPosition = (-(pd.c * CELL_W - OM)) + 'px ' + (-(pd.r * CELL_H - OM)) + 'px';

    const jitterX = (Math.random() - 0.5) * (trayCellW - BOX_W) * 0.6;
    const jitterY = (Math.random() - 0.5) * (trayCellH - BOX_H) * 0.4;
    const startLeft = trayLeft + trayCol * trayCellW + (trayCellW - BOX_W) / 2 + jitterX;
    const startTop = trayTop + trayRow * trayCellH + (trayCellH - BOX_H) / 2 + jitterY;

    piece.style.left = startLeft + 'px';
    piece.style.top = startTop + 'px';
    piece.style.zIndex = 5 + idx;

    trayCol++;
    if (trayCol >= trayCols) { trayCol = 0; trayRow++; }

    const targetLeft = boardLeft + pd.c * CELL_W - OM;
    const targetTop = boardTop + pd.r * CELL_H - OM;
    const targetCx = targetLeft + BOX_W / 2;
    const targetCy = targetTop + BOX_H / 2;

    let dragging = false, moved = false;
    let offX = 0, offY = 0, downX = 0, downY = 0;

    piece.addEventListener('pointerdown', (e) => {
      if (piece.classList.contains('placed')) return;
      dragging = true; moved = false;
      piece.setPointerCapture(e.pointerId);
      const rect = piece.getBoundingClientRect();
      downX = e.clientX; downY = e.clientY;
      offX = e.clientX - rect.left;
      offY = e.clientY - rect.top;
      piece.style.zIndex = 999;
    });

    piece.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) {
        moved = true;
        piece.classList.add('dragging');
      }
      if (!moved) return;
      const wrapRect = wrapper.getBoundingClientRect();
      piece.style.left = (e.clientX - wrapRect.left - offX) + 'px';
      piece.style.top = (e.clientY - wrapRect.top - offY) + 'px';
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      piece.classList.remove('dragging');
      if (!moved) return;

      const curLeft = parseFloat(piece.style.left);
      const curTop = parseFloat(piece.style.top);
      const curCx = curLeft + BOX_W / 2;
      const curCy = curTop + BOX_H / 2;
      const dist = Math.hypot(curCx - targetCx, curCy - targetCy);
      const threshold = Math.max(CELL_W, CELL_H) * 0.45;

      if (dist < threshold) {
        piece.style.left = targetLeft + 'px';
        piece.style.top = targetTop + 'px';
        piece.style.zIndex = 2;
        piece.classList.add('placed');
        piece.style.pointerEvents = 'none';
        placedCount++;
        progressEl.textContent = placedCount + ' / ' + total + ' platziert';
        if (placedCount === total) setTimeout(triggerReveal, 350);
      } else {
        piece.style.zIndex = 50;
      }
    }

    piece.addEventListener('pointerup', endDrag);
    piece.addEventListener('pointercancel', endDrag);

    wrapper.appendChild(piece);
  });

  if (isWide) {
    const trayTotalH = trayTop + Math.ceil(total / trayCols) * trayCellH;
    wrapper.style.width = (trayLeft + trayCols * trayCellW + 20) + 'px';
    wrapper.style.minHeight = Math.max(boardTop + BOARD_H, trayTotalH) + 20 + 'px';
  } else {
    wrapper.style.minHeight = (trayTop + (trayRow + 1) * trayCellH + 30) + 'px';
  }

  function triggerReveal(){
    board.classList.add('fadeout');

    setTimeout(() => {
      const flipOuter = document.createElement('div');
      flipOuter.className = 'flipOuter';
      flipOuter.style.left = boardLeft + 'px';
      flipOuter.style.top = boardTop + 'px';
      flipOuter.style.width = BOARD_W + 'px';
      flipOuter.style.height = BOARD_H + 'px';

      const flipInner = document.createElement('div');
      flipInner.className = 'flipInner';

      const faceFront = document.createElement('div');
      faceFront.className = 'face faceFront';

      const faceBack = document.createElement('div');
      faceBack.className = 'face faceBack';
      faceBack.style.backgroundImage = 'url(' + IMG_SRC + ')';

      document.querySelectorAll('.piece.placed').forEach(p => {
        const relLeft = parseFloat(p.style.left) - boardLeft;
        const relTop = parseFloat(p.style.top) - boardTop;
        p.style.left = relLeft + 'px';
        p.style.top = relTop + 'px';
        faceFront.appendChild(p);
      });

      flipInner.appendChild(faceFront);
      flipInner.appendChild(faceBack);
      flipOuter.appendChild(flipInner);
      wrapper.appendChild(flipOuter);

      requestAnimationFrame(() => flipInner.classList.add('flip'));
      setTimeout(winSequence, 1150);
    }, 380);
  }

  function spawnConfetti(){
    const colors = ['#ffdd66','#ff6b9d','#6bd6ff','#9b6bff','#6bff9d'];
    for (let i = 0; i < 46; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random()*100 + 'vw';
        c.style.background = colors[i % colors.length];
        c.style.animationDuration = (2 + Math.random()*1.6) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }, i * 35);
    }
  }

  function winSequence(){
    spawnConfetti();
    captionEl.classList.add('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
})();
</script>
